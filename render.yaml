services:
  - type: web
    name: new-zealankanz-backend
    runtime: node
    buildCommand: npm install -g pnpm && pnpm install && pnpm run build
    startCommand: node dist/main.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        sync: false
      - key: PUBLIC_SITE_URL
        sync: false
      - key: MAX_UPLOAD_BYTES
        value: 5000000
      - key: CACHE_TTL_MS
        value: 60000
      - key: RATE_LIMIT_TTL_MS
        value: 60000
      - key: RATE_LIMIT_LIMIT
        value: 100
