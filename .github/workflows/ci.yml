name: Backend CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: nzk_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nzk_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:55432/nzk_test
      JWT_SECRET: local-ci-only-secret-at-least-32-characters-long
      RUN_DATABASE_INTEGRATION: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit -p tsconfig.build.json
      - run: pnpm exec eslint 'src/**/*.ts' 'test/**/*.ts'
      - run: pnpm exec prisma validate
      - run: pnpm prisma:migrate:deploy
      - run: pnpm build
      - run: pnpm test --runInBand
      - run: pnpm test:e2e --runInBand
